name: Import ZAP reference
on: push
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Import and verify
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zaproxy/zaproxy.git "$RUNNER_TEMP/upstream"
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD^{tree})" = d1064f80576550b853f5a645378ea247791fd6e4
          git -C "$RUNNER_TEMP/upstream" archive HEAD | tar -x -C "$RUNNER_TEMP"
          python3 - <<'PY'
          import os, subprocess, pathlib, shutil
          src=pathlib.Path(os.environ['RUNNER_TEMP'])/'upstream'
          entries=subprocess.check_output(['git','-C',str(src),'ls-tree','-rz','HEAD']).split(b'\0')
          count=0
          for entry in entries:
              if not entry: continue
              meta,raw=entry.split(b'\t',1)
              mode,kind,sha=meta.split()
              p=os.fsdecode(raw)
              if p.startswith('.github/workflows/') or kind!=b'blob' or mode==b'120000': continue
              dest=pathlib.Path(p)
              dest.parent.mkdir(parents=True,exist_ok=True)
              data=subprocess.check_output(['git','-C',str(src),'cat-file','blob',sha.decode()])
              dest.write_bytes(data)
              dest.chmod(0o755 if mode==b'100755' else 0o644)
              actual=subprocess.check_output(['git','hash-object','--no-filters',str(dest)]).strip()
              assert actual==sha,p
              subprocess.run(['git','add','-f','--',p],check=True)
              assert subprocess.check_output(['git','rev-parse',':'+p]).strip()==sha,p
              count+=1
          print(f'Verified {count} upstream files')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Import verified upstream ZAP reference"
          git push origin HEAD:main
